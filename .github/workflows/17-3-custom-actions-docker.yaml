name: 17 - 3 - Custom Actions - Docker
on:
  workflow_dispatch:
    inputs:
      url:
        description: The URL to ping
        type: choice
        options:
          - https://www.google.com
          - https://www.superdupernandresen.com
          - invalid-url-format
      max_trials:
        description: The maximum number of trials to attempt
        required: false
        default: "10"
      delay:
        description: The delay in seconds between each trial
        required: false
        default: "5"
jobs:
  ping-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping URL
        uses: ./.github/actions/docker-ping-url
        with:
          url: ${{ inputs.url }}
          max_trials: ${{ inputs.max_trials }}
          delay: ${{ inputs.delay }}
